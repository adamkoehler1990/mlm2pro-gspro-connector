<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="620" height="430" fill="#eef1f5"/>

  <g filter="url(#shadow)">
    <rect x="40" y="26" width="540" height="378" rx="8" fill="#f3f3f3" stroke="#d0d4da"/>
    <rect x="40" y="26" width="540" height="34" rx="8" fill="#ffffff" stroke="#d0d4da"/>
    <rect x="40" y="46" width="540" height="14" fill="#ffffff"/>
    <text x="58" y="48" font-size="13" fill="#222">MLM2PRO &#8594; GSPro Connector &#8212; Setup</text>
    <text x="540" y="48" font-size="15" fill="#888">&#215;</text>
    <text x="516" y="47" font-size="15" fill="#888">&#9633;</text>
    <text x="492" y="47" font-size="15" fill="#888">&#8211;</text>
  </g>

  <text x="64" y="86" font-size="17" font-weight="bold" fill="#1a1a1a">MLM2PRO &#8594; GSPro Connector</text>
  <text x="64" y="106" font-size="12.5" fill="#555">Fill these in, then click Save. That's it.</text>

  <text x="176" y="138" font-size="12.5" fill="#222" text-anchor="end">Default club:</text>
  <rect x="190" y="126" width="74" height="22" rx="3" fill="#fff" stroke="#9aa0a8"/>
  <text x="200" y="141" font-size="12.5" fill="#222">7i</text>
  <path d="M250 134 l6 0 l-3 5 z" fill="#555"/>
  <text x="276" y="141" font-size="11.5" fill="#777">(PT = putter: shots ignored)</text>

  <text x="176" y="176" font-size="12.5" fill="#222" text-anchor="end">Monitor address:</text>
  <rect x="190" y="164" width="214" height="22" rx="3" fill="#fff" stroke="#9aa0a8"/>
  <text x="200" y="179" font-size="12.5" fill="#999">(auto-find)</text>
  <rect x="416" y="163" width="70" height="24" rx="4" fill="#e9edf2" stroke="#9aa0a8"/>
  <text x="451" y="179" font-size="12" fill="#222" text-anchor="middle">Scan...</text>
  <text x="190" y="202" font-size="11.5" fill="#777">Leave blank to auto-find a device named MLM2-...</text>

  <text x="176" y="234" font-size="12.5" fill="#222" text-anchor="end">GSPro port:</text>
  <rect x="190" y="222" width="90" height="22" rx="3" fill="#fff" stroke="#9aa0a8"/>
  <text x="200" y="237" font-size="12.5" fill="#222">921</text>
  <text x="292" y="237" font-size="11.5" fill="#777">(default 921)</text>

  <rect x="64" y="258" width="15" height="15" rx="3" fill="#2f6fde" stroke="#2f6fde"/>
  <path d="M67 265 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="88" y="270" font-size="12.5" fill="#222">Start automatically at Windows login (hidden)</text>

  <rect x="64" y="286" width="492" height="56" rx="3" fill="#fffceb" stroke="#d9cf9a"/>
  <text x="74" y="303" font-size="11.5" fill="#5a5020">One-time (required): in the Rapsodo phone app, go to Play &gt; Third Party and</text>
  <text x="74" y="319" font-size="11.5" fill="#5a5020">authorize a third-party slot (e.g. "Awesome Golf"). This lets the monitor issue</text>
  <text x="74" y="335" font-size="11.5" fill="#5a5020">session tokens. You only do this once.</text>

  <rect x="190" y="358" width="64" height="28" rx="4" fill="#2f6fde"/>
  <text x="222" y="376" font-size="12.5" fill="#fff" text-anchor="middle">Save</text>
  <rect x="266" y="358" width="120" height="28" rx="4" fill="#e9edf2" stroke="#9aa0a8"/>
  <text x="326" y="376" font-size="12" fill="#222" text-anchor="middle">Save &amp; Start now</text>
  <rect x="398" y="358" width="64" height="28" rx="4" fill="#e9edf2" stroke="#9aa0a8"/>
  <text x="430" y="376" font-size="12.5" fill="#222" text-anchor="middle">Close</text>
</svg>
